apiVersion: v1
kind: Pod
metadata:
  name: good-pod
spec:
  automountServiceAccountToken: false
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.9
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
